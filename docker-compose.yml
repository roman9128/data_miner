services:
  ai:
    build:
      context: ./ai/service
      dockerfile: Dockerfile
    container_name: data-miner-ai
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - model-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
volumes:
  model-cache: