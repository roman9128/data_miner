services:
  natasha:
    build:
      context: ./ai/natasha
      dockerfile: Dockerfile
    container_name: data-miner-natasha
    restart: unless-stopped
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  embeddings:
    build:
      context: ./ai/user2
      dockerfile: Dockerfile
    container_name: data-miner-user2_small
    ports:
      - "8001:8001"
    volumes:
      - model-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    restart: unless-stopped
volumes:
  model-cache: